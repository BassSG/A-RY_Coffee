<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#294e39"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png"><title>A-RY Coffee POS</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#253c2d;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:20px}.card{max-width:430px;width:100%;background:white;border-radius:24px;overflow:hidden;box-shadow:0 14px 50px #243b2919}.hero{height:200px;background:url('assets/icon-512.png') center 48%/cover}.body{padding:28px}small{letter-spacing:.12em;color:#718a76;font-weight:700}h1{margin:10px 0;font-size:1.8rem}p{line-height:1.6;color:#627268}.button{display:block;text-align:center;background:#315b42;color:white;text-decoration:none;font-weight:700;border:0;border-radius:14px;padding:16px;width:100%;font-size:1rem}.install{margin-top:10px;background:#edf3ec;color:#315b42;cursor:pointer}.hidden{display:none}.note{font-size:.83rem;margin-bottom:0}</style></head><body><main class="card"><div class="hero"></div><div class="body"><small>A-RY COFFEE · POINT OF SALE</small><h1>พร้อมขายได้เลย ☕</h1><p>เปิดระบบขายและดูสรุปยอดของร้านจากบัญชี Google เจ้าของร้าน</p><a class="button" href="https://script.google.com/macros/s/AKfycbw0AKfX3DgcPZSCuw9i9OHkaNXKt5W0lP1cavycPPoDt9QfEZH9vtI0ZHBDfOepMpB5/exec">เปิดระบบขาย</a><button class="button install hidden" id="install">ติดตั้งทางเข้าแอป</button><p class="note">ระบบขายเปิดผ่าน Google Apps Script และต้องเชื่อมต่ออินเทอร์เน็ต ลงชื่อเข้าใช้ด้วยบัญชีเจ้าของร้าน</p></div></main><script>let promptEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;document.getElementById('install').classList.remove('hidden')});document.getElementById('install').onclick=async()=>{if(promptEvent){await promptEvent.prompt();promptEvent=null;document.getElementById('install').classList.add('hidden')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
